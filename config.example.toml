# amphour configuration.
#
# Copy to /etc/amphour/config.toml and edit. That path is the default; override
# it with `amphour --config /somewhere/else.toml`.
#
# This file is an EXAMPLE and is tracked in git. The real config.toml is
# gitignored because it carries credentials and site detail.

# --- devices ---------------------------------------------------------------
#
# One [[device]] block per physical device. Note the DOUBLE brackets: [device]
# is a single table and will be rejected with a message saying so.
#
# `name` is free text and must be unique. It becomes the `device` label on every
# Prometheus metric and a tag on every InfluxDB point, so choose something you
# will recognise on a dashboard. Renaming a device renames its series.
#
# `amphour --list-drivers` prints what is available;
# `amphour --list-fields <driver>` prints what each one can report.

[[device]]
name = "renogy"
driver = "renogy_bt1"
# BLE MAC of the Renogy BT-1 / BT-TH module. Find it with: bluetoothctl scan on
address = "AA:BB:CC:DD:EE:FF"
# Optional advertised name. When set, amphour scans for this name instead of
# the address, which survives the module being replaced.
# alias = "BT-TH-XXXXXXXX"
# adapter = "hci0"
interval = 30.0

[[device]]
name = "smartshunt"
driver = "victron_vedirect"
port = "/dev/ttyUSB0"
baud = 19200
# How often a reading is published. The device itself streams at about 1 Hz;
# this throttles what gets stored, it does not slow the device down.
interval = 30.0
# Treat the link as failed if this long passes without a VALID block. VE.Direct
# devices transmit unprompted about once a second, so both faults are visible
# directly rather than inferred from values that stop changing:
#   - no bytes at all        -> "no data on <port> for Ns"
#   - bytes that never frame -> "no valid block for Ns (N rejected, N accepted,
#                               N bytes unframed)"
# The second matters because a noisy link delivers bytes forever and would
# otherwise look identical to a healthy quiet system. The counts in the message
# separate a marginal cable (blocks frame, checksums fail) from a wrong baud
# rate or wrong port (nothing frames at all, bytes pile up unframed).
# stale_after = 15.0

# A second VE.Direct device - an MPPT charge controller, say - is the same
# driver on a different port.
# [[device]]
# name = "mppt"
# driver = "victron_vedirect"
# port = "/dev/serial/by-id/usb-VictronEnergy_BV_VE_Direct_cable_XXXXXXXX-if00-port0"

# A Mopeka Pro Check propane puck. This one is a BEACON: amphour never connects
# to it, it only listens for the advertisement the puck broadcasts anyway.
[[device]]
name = "studio_propane"
driver = "mopeka_ble"
# BLE MAC of the puck. REQUIRED as a filter, not as a convenience: every Mopeka
# puck in radio range advertises under the same manufacturer id, including any
# retired one still sitting in a shed with a live battery, and a retired puck
# broadcasts a perfectly well formed reading of zero.
address = "AA:BB:CC:DD:EE:FF"
# Tank geometry. Known: 20LB_V, 30LB_V, 40LB_V, EUROPE_6KG, EUROPE_11KG,
# EUROPE_14KG. The puck measures DISTANCE; the percentage is that distance
# interpreted through this geometry, so getting it wrong silently rescales
# every reading. For a tank not listed, give empty_mm and full_mm together.
tank_type = "20LB_V"
# empty_mm = 38
# full_mm = 254
# adapter = "hci0"
# How often a reading is published. The puck advertises every few seconds;
# this throttles what gets stored. Propane moves slowly, so it can be long.
interval = 60.0
# Lowest read quality (zero, low, medium, high) whose level is trusted. Below
# it the level and distance are OMITTED from the reading - not zeroed, not
# NaN - while temperature, battery and quality keep publishing, so a puck that
# cannot see the liquid stays visibly alive instead of drawing an empty tank.
# min_quality = "low"
# Treat the puck as gone if this long passes with no advertisement at all.
# stale_after = 300.0

# --- sinks -----------------------------------------------------------------

[prometheus]
enabled = true
port = 5000
addr = "0.0.0.0"

# Metric names are this prefix plus the field name, e.g. amphour_battery_voltage.
# Every metric carries a `device` label, so two devices reporting the same field
# share one metric and can be compared in a single query.
metric_prefix = "amphour_"

# Fields whose meaning is still a hypothesis are not exported unless you ask.
# See `amphour --list-fields <driver>` for which is which.
include_unverified = false

[influxdb]
# Off by default. Nothing is written and no connection is attempted unless true.
enabled = false
url = "http://influxdb.example:8086"
database = "amphour"
measurement = "amphour"

# Credentials may be left empty here and supplied by environment instead:
#   AMPHOUR_INFLUX_USERNAME
#   AMPHOUR_INFLUX_PASSWORD
# The environment wins when both are set. Prefer it - a config file gets
# copied, backed up and pasted into terminals.
username = ""
password = ""

retention_policy = ""

# Same meaning as the Prometheus option above, decided separately: hypothesis
# fields are not written unless you ask. Kept independent on purpose - a
# long-term store is where you WOULD want an unverified field recorded while
# you decide what it means, even when you would not want it on a dashboard.
include_unverified = false

batch_size = 60
flush_interval = 60.0
timeout = 10.0

# Extra tags applied to every point. The `device` tag is added automatically.
[influxdb.tags]
site = "home"

[logging]
level = "INFO"       # DEBUG | INFO | WARNING | ERROR
file = ""            # empty = stderr only (systemd captures it)
keep_days = 14
